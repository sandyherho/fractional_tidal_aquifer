[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pasang"
version = "0.1.0"
description = "Tidal propagation through coastal aquifers with storage memory and fractional dynamics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Sandy H. S. Herho" },
    { name = "Dasapta E. Irawan" },
    { name = "Iwan P. Anwar" },
    { name = "Rusmawan Suwarman" },
    { name = "Deny J. Puradimaja" }
]
keywords = ["coastal aquifer", "tidal method", "fractional calculus",
            "dual porosity", "matrix diffusion", "Indonesia"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
lint = ["pycodestyle>=2.11", "pydocstyle>=6.3"]

[tool.setuptools]
packages = ["pasang"]

[tool.pydocstyle]
convention = "pep257"
